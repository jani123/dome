name: Module CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [check, 'test:race', 'test:integration', 'test:e2e', 'check:artifacts', 'docs:build', 'check:workflow']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: go install github.com/go-task/task/v3/cmd/task@v3.45.4
      - run: task dev:setup
      - run: task "${{ matrix.target }}"
