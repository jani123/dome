version: "3"

includes:
  devcontainer: .devcontainer/Taskfile.yml

vars:
  VERSION: '{{default "dev" .VERSION}}'

tasks:
  prepare:
    desc: Prepare local development directories
    cmds:
      - mkdir -p .build .codex-local
    status:
      - test -d .build && test -d .codex-local

  doctor:
    desc: Verify the Go development toolchain
    cmds:
      - go version
      - gopls version
      - dlv version
      - gofumpt --version
      - git --version
      - task --list

  dev:setup:
    desc: Prepare directories and download dependencies when a Go module exists
    cmds:
      - task: prepare
      - 'if test -f go.mod; then go mod download; fi'
      - task: tools:openspec

  module:
    internal: true
    preconditions:
      - sh: test -f go.mod
        msg: 'Initialize a Go module first: go mod init <module-path>'

  build:
    desc: Build the standalone example agent
    deps: [module, prepare]
    cmds:
      - CGO_ENABLED=0 go build -trimpath -o .build/agent ./examples/basic-agent {{.CLI_ARGS}}

  build:initializer:
    desc: Build the development initializer (init requires a tagged build)
    cmds:
      - mkdir -p .build
      - CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version={{.VERSION}}" -o .build/dome ./cmd/dome

  docs:
    desc: Build and check the pinned Hugo development guides
    cmds:
      - scripts/install-hugo.sh
      - scripts/build-docs.sh next

  docs:build:
    desc: Build and validate development documentation
    cmds:
      - task: docs

  docs:serve:
    desc: Serve Hugo guides on container port 1313 (use devcontainer:urls on the host)
    cmds:
      - scripts/serve-docs.sh

  tools:openspec:
    desc: Install the pinned checksum-verified native OpenSpec CLI
    cmds:
      - scripts/install-openspec.sh

  specs:setup:
    desc: Refresh the repository's pinned Codex OpenSpec workflows
    cmds:
      - scripts/setup-specs.sh

  check:knowledge:
    desc: Validate Google OKF format and Dome authoring policy
    cmds:
      - go run scripts/check-knowledge.go -policy

  check:specs:
    desc: Strictly validate active OpenSpec changes and capability specs
    cmds:
      - go run scripts/check-maintainer-skills.go
      - scripts/openspec.sh validate --all --strict

  check:artifacts:
    desc: Validate maintained knowledge and specification artifacts
    cmds:
      - task: check:knowledge
      - task: check:specs
      - go run scripts/sync-module-assets.go --check

  test:
    desc: Run Go tests
    deps: [module]
    cmds:
      - go test {{.CLI_ARGS}} ./...

  fmt:
    desc: Format Go sources
    deps: [module]
    cmds:
      - gofumpt -w agent cli cmd config core modules examples internal tests scripts

  check:
    desc: Check Go formatting, vet packages and run tests
    deps: [module]
    cmds:
      - task: check:format
      - go vet ./...
      - task: test

  check:format:
    desc: Check tracked and new Go source without modifying it
    cmds:
      - scripts/check-format.sh

  tools:review:
    desc: Install pinned review tools into ignored local storage
    cmds:
      - mkdir -p .build/tools
      - GOBIN="$PWD/.build/tools" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - GOBIN="$PWD/.build/tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - GOBIN="$PWD/.build/tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

  check:static:
    desc: Run pinned Staticcheck
    preconditions:
      - sh: test -x .build/tools/staticcheck
        msg: Run task tools:review first
    cmds:
      - .build/tools/staticcheck ./...

  check:security:
    desc: Check reachable Go vulnerabilities (requires vulnerability database access)
    preconditions:
      - sh: test -x .build/tools/govulncheck
        msg: Run task tools:review first
    cmds:
      - .build/tools/govulncheck ./...

  check:workflow:
    desc: Check GitHub workflow and shell syntax
    preconditions:
      - sh: test -x .build/tools/actionlint
        msg: Run task tools:review first
    cmds:
      - .build/tools/actionlint -shellcheck=
      - for script in scripts/*.sh .devcontainer/*.sh; do bash -n "$script" || exit; done

  test:race:
    desc: Run unit tests with the Go race detector
    deps: [module]
    cmds:
      - go test -race ./... {{.CLI_ARGS}}

  test:e2e:
    desc: Run the standalone agent container E2E suite
    deps: [module]
    cmds:
      - go test -tags=e2e ./tests/e2e -count=1 -timeout=10m {{.CLI_ARGS}}

  test:integration:
    desc: Run real Git HTTP and SSH integration tests
    deps: [module]
    cmds:
      - go test -tags=integration ./... -count=1 -timeout=10m {{.CLI_ARGS}}
