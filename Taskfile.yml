version: "3"

includes:
  devcontainer: .devcontainer/Taskfile.yml

tasks:
  prepare:
    desc: Prepare local development directories
    cmds:
      - mkdir -p .build .codex-local
    status:
      - test -d .build && test -d .codex-local

  doctor:
    desc: Verify the Go development toolchain
    cmds:
      - go version
      - gopls version
      - dlv version
      - gofumpt --version
      - git --version
      - task --list

  dev:setup:
    desc: Prepare directories and download dependencies when a Go module exists
    cmds:
      - task: prepare
      - 'if test -f go.mod; then go mod download; fi'
      - task: tools:openspec

  module:
    internal: true
    preconditions:
      - sh: test -f go.mod
        msg: 'Initialize a Go module first: go mod init <module-path>'

  build:
    desc: Build the standalone example agent
    deps: [module, prepare]
    cmds:
      - CGO_ENABLED=0 go build -trimpath -o .build/agent ./examples/basic-agent {{.CLI_ARGS}}

  build:initializer:
    desc: Build the development initializer (init requires a tagged build)
    cmds:
      - make build-initializer

  docs:
    desc: Build and check the pinned Hugo development guides
    cmds:
      - make docs

  tools:openspec:
    desc: Install the pinned checksum-verified native OpenSpec CLI
    cmds:
      - make tools-openspec

  specs:setup:
    desc: Refresh the repository's pinned Codex OpenSpec workflows
    cmds:
      - make setup-specs

  check:knowledge:
    desc: Validate Google OKF format and Dome authoring policy
    cmds:
      - make check-knowledge

  check:specs:
    desc: Strictly validate active OpenSpec changes and capability specs
    cmds:
      - make check-specs

  check:artifacts:
    desc: Validate maintained knowledge and specification artifacts
    cmds:
      - make check-artifacts

  test:
    desc: Run Go tests
    deps: [module]
    cmds:
      - go test {{.CLI_ARGS}} ./...

  fmt:
    desc: Format Go sources
    deps: [module]
    cmds:
      - gofumpt -w agent cli cmd config core modules examples internal tests scripts

  check:
    desc: Check Go formatting, vet packages and run tests
    deps: [module]
    cmds:
      - test -z "$(gofumpt -l agent cli cmd config core modules examples internal tests scripts)"
      - go vet ./...
      - task: test

  test:race:
    desc: Run unit tests with the Go race detector
    deps: [module]
    cmds:
      - go test -race ./... {{.CLI_ARGS}}

  test:e2e:
    desc: Run the standalone agent container E2E suite
    deps: [module]
    cmds:
      - go test -tags=e2e ./tests/e2e -count=1 -timeout=10m {{.CLI_ARGS}}

  test:integration:
    desc: Run real Git HTTP and SSH integration tests
    deps: [module]
    cmds:
      - go test -tags=integration ./... -count=1 -timeout=10m {{.CLI_ARGS}}
